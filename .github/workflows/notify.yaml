name: crypto-notify
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: crypto-notify
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/cache/restore@v4
        with:
          path: state
          key: state-${{ github.run_id }}
          restore-keys: state-
      - run: node --experimental-default-type=module notify.js
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TF: "1h"
          RUN_MIN: "45"
          TZ: Asia/Taipei
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: state
          key: state-${{ github.run_id }}
      - name: save journal
        if: always()
        run: |
          if [ -f data/journal.json ] && [ -n "$(git status --porcelain data)" ]; then
            git config user.name "crypto-bot"
            git config user.email "crypto-bot@users.noreply.github.com"
            git add data
            git commit -m "更新累積經驗" -q
            git pull --rebase -q && git push -q || echo "push skipped"
          fi
      - name: start next round
        if: success() || failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run "${{ github.workflow }}" --ref "${{ github.ref_name }}" -R "${{ github.repository }}" || echo "下一輪沒啟動成功，等排程補上"
