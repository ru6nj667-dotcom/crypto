<p class="mut">此頁只讀幣安公開行情，不會下單。回測與學習都有可能失準，訊號不是保證；每筆都要掛停損。</p>
</main>
<script>
let COINS=[];const TFS=["3m","15m","1h","4h"];let side=1;
const P={n:20,win:12,tol:.25,stop:.5,rr:2,risk:.01,lev:2,vol:1.2,retest:true,btc:false};
const RESTS=["https://data-api.binance.vision","https://api.binance.com","https://api1.binance.com"],WSU="wss://data-stream.binance.vision";let REST=RESTS[0];
let tf="1h",cur="BTC",D={},A={},ws=null,lastMsg=0,raf=0;
const $=i=>document.getElementById(i);
const TFMS={"3m":18e4,"15m":9e5,"1h":36e5,"4h":144e5};
const hm=ms=>{const d=new Date(ms);return (d.getMonth()+1)+"/"+d.getDate()+" "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")};
const fp=v=>v>=100?v.toFixed(2):v>=1?v.toFixed(4):v.toFixed(6);
/*A*/
function ema(a,n){const k=2/(n+1);let e=a[0];return a.map((v,i)=>{if(i)e=v*k+e*(1-k);return e})}
function base(k){const n=k.length,cl=k.map(x=>x.c),e50=ema(cl,50),e200=ema(cl,200),atr=[];let a=0;
 k.forEach((x,i)=>{const tr=i?Math.max(x.h-x.l,Math.abs(x.h-cl[i-1]),Math.abs(x.l-cl[i-1])):x.h-x.l;a=i?a+(tr-a)/14:tr;atr.push(a)});
 const R={};[20,50].forEach(m=>{const hh=[],ll=[],av=[];for(let t=0;t<n;t++){if(t<m){hh.push(NaN);ll.push(NaN);av.push(0);continue}
  let h=-Infinity,l=Infinity,s=0;for(let j=t-m;j<t;j++){if(k[j].h>h)h=k[j].h;if(k[j].l<l)l=k[j].l;s+=k[j].v}hh.push(h);ll.push(l);av.push(s/m)}R[m]={hh,ll,av}});
 const tdir=new Map();for(let t=0;t<n;t++)tdir.set(k[t].t,e50[t]>e200[t]*1.001?1:e50[t]<e200[t]*.999?-1:0);
 return{cl,e50,e200,atr,R,tdir}}
function sigs(k,B,p){const n=k.length,{e50,e200,atr}=B,{hh,ll,av}=B.R[p.n],sg=[];let pend=null;
 for(let t=210;t<n;t++){const x=k[t],T=atr[t],volR=av[t]>0?x.v/av[t]:0,body=Math.abs(x.c-x.o),lw=Math.min(x.o,x.c)-x.l,uw=x.h-Math.max(x.o,x.c),
   bullC=x.c>x.o||lw>=body,bearC=x.c<x.o||uw>=body;
  const mk=(s,stop,vr)=>({t,time:x.t,s,entry:x.c,stop,f:{vol:vr,trend:(e50[t]-e200[t])/e200[t]*100*s,atrp:T/x.c*100,ext:(x.c-e50[t])/T*s,wick:(s>0?lw:uw)>=body?"影線":"實體"}});
  if(pend){const s=pend.s,lv=pend.lv;
   if(t>pend.ex||(s>0&&x.c<lv)||(s<0&&x.c>lv))pend=null;
   else if(s>0&&x.l<=lv+p.tol*T&&x.c>lv&&bullC){sg.push(mk(1,Math.min(x.l,lv)-p.stop*T,pend.vr));pend=null;continue}
   else if(s<0&&x.h>=lv-p.tol*T&&x.c<lv&&bearC){sg.push(mk(-1,Math.max(x.h,lv)+p.stop*T,pend.vr));pend=null;continue}}
  if(!pend){const up=x.c>e50[t]&&e50[t]>e200[t]&&x.c>hh[t]&&volR>=p.vol,dn=x.c<e50[t]&&e50[t]<e200[t]&&x.c<ll[t]&&volR>=p.vol;
   if(up){if(p.retest)pend={s:1,lv:hh[t],ex:t+p.win,vr:volR};else sg.push(mk(1,hh[t]-p.stop*T,volR))}
   else if(dn){if(p.retest)pend={s:-1,lv:ll[t],ex:t+p.win,vr:volR};else sg.push(mk(-1,ll[t]+p.stop*T,volR))}}}
 return{sg:p.btc?sg.filter(g=>btcRel(g.time,g.s)==="順BTC方向"):sg,pend}}
function analyze(k){const n=k.length;if(n<220)return{sg:[],pend:null,n,kk:k,bt:{n:0,win:0,avg:0,tr:[]}};
 const B=base(k),{sg,pend}=sigs(k,B,P);let hn=-Infinity,ln=Infinity;for(let j=n-P.n;j<n;j++){hn=Math.max(hn,k[j].h);ln=Math.min(ln,k[j].l)}
 return{sg,pend,n,kk:k,B,e50:B.e50,e200:B.e200,tdir:B.tdir,bt:backtest(k,sg,P),atr:B.atr[n-1],hn,ln,lastT:k[n-1].t,c:B.cl[n-1]}}
function backtest(k,sg,p){ // 下一根開盤進場、扣手續費0.05%x2與滑價0.03%x2、同一根同時碰到停損停利時算停損（保守）
 const F=.0005,S=.0003,H=48,tr=[];let last=-1;
 for(const g of sg){const t=g.t;if(t<=last||t+1>=k.length)continue;
  const e=k[t+1].o*(1+S*g.s),dist=(e-g.stop)*g.s;if(dist<=0)continue;
  const tp=e+g.s*p.rr*dist;let ex=null,j=t+1;
  for(;j<Math.min(k.length,t+1+H);j++){const b=k[j];
   if(g.s>0?b.l<=g.stop:b.h>=g.stop){ex=g.stop;break}
   if(g.s>0?b.h>=tp:b.l<=tp){ex=tp;break}}
  if(ex===null){if(j>=k.length)continue;ex=k[j-1].c}
  ex*=1-S*g.s;tr.push({R:((ex-e)*g.s-e*F*2)/dist,time:g.time,s:g.s,f:g.f});last=j}
 return{...summ(tr.map(x=>x.R)),tr}}
function summ(rs){return rs.length?{n:rs.length,win:rs.filter(r=>r>0).length/rs.length*100,avg:rs.reduce((a,b)=>a+b,0)/rs.length}:{n:0,win:0,avg:0}}
function btcRel(time,s){const b=A.BTC;if(!b||!b.tdir)return"BTC方向不明";const d=b.tdir.get(time);return d===undefined||d===0?"BTC方向不明":d===s?"順BTC方向":"逆BTC方向"}
const f2=x=>(x>=0?"+":"")+x.toFixed(2)+"R";
function lsg(k,d){try{return JSON.parse(localStorage.getItem(k)||"null")??d}catch(e){return d}}
function lss(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
/* ===== 自動找最佳規則：試 144 種組合，用前 70% 歷史挑最好的，再用沒看過的後 30% 驗證 ===== */
const GRID=[];for(const n of[20,50])for(const stop of[.5,1,1.5])for(const rr of[1.5,2,3])for(const vol of[0,1.2])for(const retest of[true,false])for(const btc of[false,true])GRID.push({n,stop,rr,vol,retest,btc});
let ACTIVE=false,OPT=null,optBusy=false;
function pdesc(g){return`突破近 ${g.n} 根高/低點${g.vol?"、要放量":"、不看量"}、${g.retest?"等回踩再進":"突破當根收盤就進"}${g.btc?"、只做跟 BTC 同方向":""}；停損 ${g.stop} 倍 ATR、停利 ${g.rr} 倍風險`}
async function optimize(){if(optBusy||!A.BTC||!A.BTC.B)return;optBusy=true;const myTf=tf;
 const coins=COINS.filter(c=>A[c]&&A[c].B),times=A.BTC.kk.map(x=>x.t),cutT=times[Math.floor(times.length*.7)],res=[];
 for(let i=0;i<GRID.length;i++){const g={...P,...GRID[i]},tr=[];
  coins.forEach(c=>{const a=A[c];backtest(a.kk,sigs(a.kk,a.B,g).sg,g).tr.forEach(x=>tr.push(x))});
  res.push({g:GRID[i],train:summ(tr.filter(x=>x.time<cutT).map(x=>x.R)),test:summ(tr.filter(x=>x.time>=cutT).map(x=>x.R))});
  if(i%6===5){$("optsum").textContent=`🧠 AI 正在學習… ${i+1}/${GRID.length}`;await new Promise(r=>setTimeout(r,0));if(tf!==myTf){optBusy=false;return}}}
 const ok=res.filter(r=>r.train.n>=30).sort((a,b)=>b.train.avg-a.train.avg),best=ok[0];
 const pass=!!best&&best.train.avg>0&&best.test.n>=10&&best.test.avg>0;
 if(best)Object.assign(P,best.g);ACTIVE=pass;
 OPT={best,pass,top:ok.slice(0,5),tested:res.length,coins:coins.length,cutT,time:Date.now()};
 const hk="opt_"+tf,hist=lsg(hk,{h:[]});hist.g=best?best.g:null;hist.pass=pass;hist.h.push({time:Date.now(),g:best?best.g:null,train:best?best.train:null,test:best?best.test:null,pass});hist.h=hist.h.slice(-20);lss(hk,hist);
 coins.forEach(c=>{A[c]=analyze(A[c].kk)});learn();paintAll();optBusy=false}
function loadSaved(){const s=lsg("opt_"+tf,null);if(s&&s.g){Object.assign(P,s.g);ACTIVE=!!s.pass}else ACTIVE=false}
function paintOpt(){const el=$("opt");if(!el)return;const O=OPT,hist=(lsg("opt_"+tf,{h:[]}).h||[]).slice().reverse();
 if(!O){$("optsum").textContent="🧠 AI 學習中…";el.innerHTML="<p class='mut'>正在用最新資料測試各種規則組合。</p>";return}
 const b=O.best;
 $("optsum").innerHTML=O.pass?`🧠 AI 學習：✅ 找到有效規則（新資料平均 ${f2(b.test.avg)}）`:`🧠 AI 學習：⛔ 這個週期沒有規則通過驗證，暫停進場訊號`;
 let h=`<p class="mut">用 ${O.coins} 個幣、各 1000 根 ${tf} K線，試了 ${O.tested} 種規則組合（突破長短、要不要量、要不要等回踩、要不要跟 BTC 同方向、停損停利幾倍）。<b>${hm(O.cutT)} 以前</b>的資料用來挑最好的，<b>之後</b>的資料完全不給它看，最後才拿來檢查是不是真的會賺。每 15 分鐘會用最新K線自動重新學一次，換成當下最強的那組。</p>`;
 if(b)h+=`<p><b>目前最好的規則：</b>${pdesc(b.g)}。<br>挑選期：${b.train.n} 筆，勝率 ${b.train.win.toFixed(0)}%，平均 ${f2(b.train.avg)}<br>沒看過的新資料：${b.test.n} 筆，勝率 ${b.test.win.toFixed(0)}%，平均 ${f2(b.test.avg)}</p>
 <p>${O.pass?"<b style='color:var(--up)'>新資料也賺錢 → 已套用這個規則產生進場訊號。</b>":"<b style='color:var(--dn)'>新資料上是虧的或筆數不夠 → 代表它只是剛好配合過去，不能信。這個週期暫停給你進場訊號，可以切換別的週期看看。</b>"}</p>`;
 h+="<p class='mut'>挑選期排名前 5（平均每筆賺賠）：</p><table><tr><th>規則</th><th>筆數</th><th>勝率</th><th>平均</th></tr>"+O.top.map(r=>`<tr><td class="mut">${pdesc(r.g)}</td><td>${r.train.n}</td><td>${r.train.win.toFixed(0)}%</td><td>${f2(r.train.avg)}</td></tr>`).join("")+"</table>";
 if(hist.length)h+="<p class='mut' style='margin-top:10px'>學習紀錄（這支手機）：</p><table><tr><th>時間</th><th>新資料結果</th><th>套用</th></tr>"+hist.slice(0,10).map(x=>`<tr><td>${hm(x.time)}</td><td>${x.test?`${x.test.n} 筆 ${f2(x.test.avg)}`:"-"}</td><td>${x.pass?"✅":"⛔"}</td></tr>`).join("")+"</table>";
 el.innerHTML=h}
/* ===== 錯誤來源分析：目前規則的訊號，哪種情況最常做錯 ===== */
let LEARN=null;
const FEAT=[["btc","BTC 大盤方向"],["vol","突破時的成交量倍數"],["trend","趨勢強度（均線分開程度）"],["atrp","波動大小"],["ext","離均線多遠（追得多高）"],["wick","進場K棒樣子"]];
function bucket(f,v,cuts){if(f==="btc"||f==="wick")return v;const c=cuts[f];return v<c[0]?"低":v<c[1]?"中":"高"}
function featsOf(g){return{...g.f,btc:btcRel(g.time,g.s)}}
function learn(){const all=[];COINS.forEach(c=>{const a=A[c];if(a&&a.bt&&a.bt.tr)a.bt.tr.forEach(x=>all.push({...x,F:featsOf(x)}))});
 all.sort((a,b)=>a.time-b.time);if(all.length<60){LEARN={few:true,n:all.length};return}
 const cut=Math.floor(all.length*.7),train=all.slice(0,cut),test=all.slice(cut),q=(arr,p)=>{const s=[...arr].sort((a,b)=>a-b);return s[Math.floor(p*(s.length-1))]};
 const cuts={};["vol","trend","atrp","ext"].forEach(f=>{const v=train.map(x=>x.F[f]);cuts[f]=[q(v,1/3),q(v,2/3)]});
 const rows=[],bad=[];FEAT.forEach(([f,name])=>{const g={};train.forEach(x=>{const b=bucket(f,x.F[f],cuts);(g[b]=g[b]||[]).push(x.R)});
  Object.keys(g).forEach(b=>{const st=summ(g[b]),isBad=st.n>=20&&st.avg<0;rows.push({f,name,b,...st,isBad});if(isBad)bad.push([f,b])})});
 const hit=x=>bad.find(([f,b])=>bucket(f,x.F[f],cuts)===b),base0=summ(test.map(x=>x.R)),filt=summ(test.filter(x=>!hit(x)).map(x=>x.R));
 LEARN={rows,bad,cuts,base:base0,filt,applied:bad.length>0&&filt.n>=10&&filt.avg>base0.avg&&filt.avg>0,ntrain:train.length,ntest:test.length,all:summ(all.map(x=>x.R))}}
function learnBlock(g){if(!LEARN||!LEARN.applied)return null;const F=featsOf(g),m=LEARN.bad.find(([f,b])=>bucket(f,F[f],LEARN.cuts)===b);
 return m?`${FEAT.find(x=>x[0]===m[0])[1]}「${m[1]}」`:null}
function paintLearn(){const L=LEARN,el=$("learn");if(!el)return;
 if(!L){$("learnsum").textContent="🔍 錯誤來源分析";el.innerHTML="";return}
 if(L.few){$("learnsum").textContent="🔍 錯誤來源分析：樣本太少";el.innerHTML=`<p class='mut'>目前規則在這個週期只有 ${L.n} 筆歷史訊號，太少，不能分析。</p>`;return}

  if(k[k.length-1].t===b.t)k[k.length-1]=b;else k.push(b);
  if(q.x){A[c]=analyze(k.slice());clearTimeout(window._lt);window._lt=setTimeout(()=>{learn();paintLearn()},3000)}
  if(!raf)raf=requestAnimationFrame(()=>{raf=0;paint()});};
}
function setConn(t,c){const e=$("conn");e.textContent=t;e.className=c}
function paint(){
 const cands=COINS.filter(c=>{const q=judge(c);return q.sig&&!q.weak});
 $("coins").innerHTML="<b style='white-space:nowrap'>可進場候選：</b>"+(cands.length?cands.map(c=>{const q=judge(c);return`<button class="${q.sig.s.s>0?"lg":"sh"}" onclick="sel('${c}')">${c} ${q.sig.s.s>0?"做多":"做空"}</button>`}).join(""):"<span class='mut'>目前沒有（全部等待中）</span>");
 $("tfs").innerHTML=TFS.map(t=>`<button class="${t===tf?"on":""}" onclick="if(tf!=='${t}'){tf='${t}';load()}">${t}</button>`).join("");
 const k=D[cur];if(!k)return;
 const j=judge(cur),last=k[k.length-1];
 $("sym").textContent=cur+"/USDT · "+tf;$("price").textContent=fp(last.c);
 $("age").textContent=Date.now()-lastMsg<10000?"價格剛更新（"+Math.round((Date.now()-lastMsg)/1000)+" 秒前）":"資料已中斷，停止判斷";
 $("st").textContent=j.txt;$("st").className="tag "+(j.cls||"");
 const eq=+$("eq").value||0;
 if(j.sig){const{s,tp,rr,d,live}=j.sig,notional=Math.min(eq*P.risk/(d/live),eq*P.lev);
  $("sig").textContent=j.why+" 以下用現價重新計算：";
  $("lv").innerHTML=[["現價",fp(live)],["訊號收盤價",fp(s.entry)],["停損",fp(s.stop)],["停利（"+P.rr+"R）",fp(tp)],["現價下風險報酬",rr.toFixed(1)],["倉位（下單金額）",notional.toFixed(1)+" USDT"],["槓桿（倉位÷本金）",Math.max(1,Math.ceil(notional/eq*10)/10).toFixed(1)+" 倍（上限 2）"],["碰停損會虧",(notional*d/live+notional*.001).toFixed(1)+" USDT"],["到停利約賺",(notional*Math.abs(tp-live)/live-notional*.001).toFixed(1)+" USDT"]].map(x=>`<div class="k"><small>${x[0]}</small><b>${x[1]}</b></div>`).join("");
 }else{$("sig").textContent=j.why||"目前沒有可行動的候選訊號。";$("lv").innerHTML=""}
 const bt=A[cur]&&A[cur].bt;$("bt").textContent=bt?(bt.n?`目前規則在 ${cur} 最近 1000 根 ${tf} K 線的表現：訊號 ${bt.n} 次，勝率 ${bt.win.toFixed(0)}%，平均每筆 ${bt.avg>=0?"+":""}${bt.avg.toFixed(2)}R（已扣手續費與滑價）。${bt.n<5?"次數太少，不可靠。":bt.avg<=0?"過去是虧的，這個幣不建議用此規則。":"過去為正，但不代表未來。"}`:`這個規則在 ${cur} 最近 1000 根K線沒有出現過訊號。`):"";
 const rank=c=>{const q=judge(c),a=A[c]||{},bt=a.bt||{n:0},T=a.atr||1;
  const stage=q.sig&&!q.weak?4:/^已(突破|跌破)/.test(q.txt)?3:q.sig?2:q.txt==="等待"&&dirOf(c)!==0?1:0;
  const qual=bt.n>=3?bt.avg:-9;
  const dist=a.pend?Math.abs(a.c-a.pend.lv)/T:a.c?Math.abs((dirOf(c)>0?a.hn:a.ln)-a.c)/T:99;
  return{q,stage,qual,dist,bt}};
 const cnt=d=>COINS.filter(c=>dirOf(c)===d).length;
 $("sides").innerHTML=[[1,"▲ 做多"],[-1,"▼ 做空"],[0,"方向不明"]].map(([d,t])=>`<button class="${side===d?(d>0?"lg":d<0?"sh":"on"):""}" onclick="side=${d};paint()">${t}（${cnt(d)}）</button>`).join("");
 $("sidehint").textContent=(side>0?"多頭方向的幣，只找做多。":side<0?"空頭方向的幣，只找做空。":"均線糾纏、方向不明，這些不做。")+" 排序：①現在就能進場 ②已突破等回踩 ③其他；同一層裡，過去用這規則越賺錢的排越上面，再來是離進場點越近的。";
 $("list").innerHTML=COINS.filter(c=>dirOf(c)===side).map(c=>({c,...rank(c)})).sort((a,b)=>b.stage-a.stage||b.qual-a.qual||a.dist-b.dist).map(({c,q:jj,bt},i)=>{const kk=D[c];
  const hist=bt.n>=3?`<span style="color:${bt.avg>0?"var(--up)":"var(--dn)"}">#${i+1}・歷史勝率 ${bt.win.toFixed(0)}%・平均 ${f2(bt.avg)}（${bt.n} 筆）</span>`:`<span>#${i+1}・歷史訊號太少，無法評分</span>`;
  jj={...jj,why:hist+"<br>"+(jj.why||"")};return`<tr class="${c===cur?"sel":""}" onclick="sel('${c}')"><td><b>${c}</b></td><td>${kk?fp(kk[kk.length-1].c):"--"}</td><td><span class="tag ${jj.cls||""}">${jj.txt}</span></td></tr>${jj.why?`<tr class="${c===cur?"sel":""}" onclick="sel('${c}')"><td colspan="3" class="mut" style="padding-top:0">${jj.why}</td></tr>`:""}`}).join("");
 draw();
}
function draw(){
 const cv=$("cv"),r=devicePixelRatio||1,w=cv.clientWidth,h=300,g=cv.getContext("2d"),st=getComputedStyle(document.body);
 cv.width=w*r;cv.height=h*r;g.scale(r,r);
 const up=getComputedStyle(document.documentElement).getPropertyValue("--up"),dn=getComputedStyle(document.documentElement).getPropertyValue("--dn"),mut=getComputedStyle(document.documentElement).getPropertyValue("--mut"),ac=getComputedStyle(document.documentElement).getPropertyValue("--ac"),bd=getComputedStyle(document.documentElement).getPropertyValue("--bd");
 const k=D[cur],a=A[cur];if(!k)return;
 const V=Math.min(80,k.length),s0=k.length-V,vis=k.slice(s0);
 let lo=Math.min(...vis.map(x=>x.l)),hi=Math.max(...vis.map(x=>x.h));const pd=(hi-lo)*.06;lo-=pd;hi+=pd;
 const R=58,bw=(w-R)/V,y=v=>6+(hi-v)/(hi-lo)*(h-14),x=i=>(i+.5)*bw;
 g.font="10px sans-serif";g.fillStyle=mut;g.strokeStyle=bd;
 for(let i=0;i<=4;i++){const v=lo+(hi-lo)*i/4;g.beginPath();g.moveTo(0,y(v));g.lineTo(w-R,y(v));g.stroke();g.fillText(fp(v),w-R+4,y(v)+3)}
 vis.forEach((c,i)=>{const col=c.c>=c.o?up:dn;g.strokeStyle=col;g.fillStyle=col;g.beginPath();g.moveTo(x(i),y(c.h));g.lineTo(x(i),y(c.l));g.stroke();g.fillRect(x(i)-bw*.31,Math.min(y(c.o),y(c.c)),bw*.62,Math.max(1.5,Math.abs(y(c.o)-y(c.c))))});
 if(a&&a.e50){[[a.e50,ac],[a.e200,"#e0a800"]].forEach(([e,col])=>{g.strokeStyle=col;g.lineWidth=1.2;g.beginPath();let on=0;vis.forEach((c,i)=>{const idx=s0+i;if(idx<e.length){on?g.lineTo(x(i),y(e[idx])):g.moveTo(x(i),y(e[idx]));on=1}});g.stroke();g.lineWidth=1});
  a.sg.forEach(s=>{const i=s.t-s0;if(i>=0){g.fillStyle=s.s>0?up:dn;g.font="14px sans-serif";g.fillText(s.s>0?"▲":"▼",x(i)-6,s.s>0?y(vis[i].l)+15:y(vis[i].h)-5)}})}
 const lp=k[k.length-1].c;g.setLineDash([4,3]);g.strokeStyle=ac;g.beginPath();g.moveTo(0,y(lp));g.lineTo(w-R,y(lp));g.stroke();g.setLineDash([]);
 g.fillStyle=ac;g.fillRect(w-R,y(lp)-8,R,16);g.fillStyle="#fff";g.font="11px sans-serif";g.fillText(fp(lp),w-R+3,y(lp)+4);
}
let actx=null,alertOn=false,seen=new Set(),firstPass=true;
function enableAlert(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();actx.resume()}catch(e){}
 if(window.Notification&&Notification.permission==="default")Notification.requestPermission();
 alertOn=true;$("alertBtn").textContent="🔔 提醒已開啟";$("alertBtn").className="on";
 $("alertHint").textContent=" 頁面要保持開著、螢幕亮著才會響";beep()}
function beep(){if(!actx)return;try{const o=actx.createOscillator(),g=actx.createGain();o.connect(g);g.connect(actx.destination);o.frequency.value=880;g.gain.setValueAtTime(.25,actx.currentTime);g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+.6);o.start();o.stop(actx.currentTime+.6)}catch(e){}}
function checkAlerts(){const now=COINS.filter(c=>{const q=judge(c);return q.sig&&!q.weak});
 now.forEach(c=>{const q=judge(c),key=c+tf+A[c].lastT;if(seen.has(key))return;seen.add(key);if(firstPass)return;logAdd(c,q);
  const msg=`${c} 可以${q.sig.s.s>0?"做多":"做空"}（${tf}）停損 ${fp(q.sig.s.stop)} 停利 ${fp(q.sig.tp)}`;
  document.title="🔔 "+msg;if(alertOn){beep();setTimeout(beep,700);try{if(window.Notification&&Notification.permission==="granted")new Notification("進場候選",{body:msg})}catch(e){}}});
 if(Object.keys(A).length)firstPass=false}
setInterval(checkAlerts,2000);setInterval(paintLog,5000);setInterval(optimize,9e5);setInterval(()=>{checkPos();paintPos();paintRec()},2000);
$("eq").oninput=paint;addEventListener("resize",paint);setInterval(paint,1000);load();
